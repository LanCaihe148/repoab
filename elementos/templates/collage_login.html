<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nuestros momentos ❤️</title>
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .caja {
            background: rgba(255,255,255,0.1);
            padding: 35px 30px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
            width: 300px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 10px;
            border: none;
            margin: 15px 0;
            font-size: 16px;
        }
        button {
            padding: 12px 28px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .error { color: #ff8a8a; margin: 0; }
    </style>
</head>
<body>
    <div class="caja">
        <h2>🔒 Nuestros momentos</h2>
        <p>Escribe la contraseña para entrar</p>
        <form method="post">
            {% csrf_token %}
            <input type="password" name="password" placeholder="Contraseña" autofocus>
            {% if error %}<p class="error">{{ error }}</p>{% endif %}
            <button type="submit">Entrar ❤️</button>
        </form>
    </div>
</body>
</html>
