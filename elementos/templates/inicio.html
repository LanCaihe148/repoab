{% extends "base.html" %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'elementos/css/styles.css' %}">
<div class="text-center mb-4">
    <h2>📬 Cartas</h2>
    <h4 class="text-muted">{{ total_cartas }} cartas guardadas</h4>

    <a href="{% url 'elementos:lista_cartas' %}" class="btn btn-secondary mt-3">
        Ver cartas
    </a>
</div>

<div class="contenedor-boton">
    <a href="{% url 'elementos:collage' %}">
        <button class="btn-momentos">Nuestros momentos ❤️</button>
    </a>
</div>

<hr class="my-5">

<h4>📝 Notitas de Efra para Abi</h4>

<div class="d-flex gap-3 flex-wrap">
    {% for nota in notas %}
        <div class="nota">
            <p>{{ nota.cuerpo }}</p>
            <small>
                {{ nota.creada|date:"H:i d/m" }}
            </small>
        </div>
    {% empty %}
        <p>No hay notas.</p>
    {% endfor %}
</div>

<div class="text-center mt-4">
    <button id="btnSanValentin" class="btn-san-valentin">
        💌 Tengo algo para ti
    </button>
</div>




{% endblock %}
