{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzón de Abi</title>
    <link rel="stylesheet" href="{% static 'elementos/css/styles.css' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'elementos/css/extras.css' %}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'elementos:inicio' %}">
            📬 Buzón de Abi
        </a>

        <div class="ms-auto">
            <a class="nav-link text-white" href="{% url 'elementos:lista_cartas' %}">
                Cartas
            </a>
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}{% endblock %}
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const btn = document.getElementById("btnSanValentin");
    if (btn) {
        btn.addEventListener("click", function () {
            document.getElementById("modalSan").style.display = "block";
        });
    }
});

function cerrarSan() {
    document.getElementById("modalSan").style.display = "none";
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/main.js' %}"></script>
{% include "san_valentin_modal.html" %}

</body>
</html>
