<!DOCTYPE html>
<html>
<head>
    <title>Subir recuerdo ❤️</title>

    <style>
        body {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 320px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #ff4d6d;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #ddd;
            outline: none;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 15px;
            background: #ff4d6d;
            color: white;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff1e4d;
            transform: scale(1.05);
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }

        .back {
            margin-top: 15px;
            display: inline-block;
            color: #555;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: #000;
        }
    </style>
</head>

<body>

<div class="form-container">
    <h2>Agregar recuerdo ❤️</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="password" name="password" placeholder="Contraseña" required>
        <input type="file" name="imagen" required>
        <textarea name="descripcion" placeholder="Escribe algo bonito..."></textarea>

        <button type="submit">Subir 📸</button>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </form>

    <a href="{% url 'elementos:collage' %}" class="back">← Volver</a>
</div>

</body>
</html>
